<h6 mat-dialog-title class="dialog-title">{{data.value}} projet</h6>
<br>
<div mat-dialog-content>
    <form [formGroup]="projecteFormgroup" >
        <mat-form-field appearance="outline" class="custom-form-field">
            <mat-label>Code projet</mat-label>
            <input matInput aria-label="code" placeholder="code" formControlName="code" required />
        </mat-form-field>
        <br>
        <mat-form-field appearance="outline" class="custom-form-field">
            <mat-label>Libelle projet</mat-label>
            <input matInput aria-label="libelel" placeholder="libelle" formControlName="libelle" required />

         </mat-form-field>
