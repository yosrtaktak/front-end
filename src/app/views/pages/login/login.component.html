<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management</title>
 
  <style>
          @media screen and (max-width: 767px) {
  body{
    width: 178%;
    margin-left:100px ;
  }
  button{
    margin-left: -34px;
  }
    }
  </style>
</head>
<body class="example-container">

<div class="bg-light min-vh-100 d-flex flex-row align-items-center">
  <c-container>
    <c-row class="justify-content-center">
      <c-col md="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form cForm class="form" class="needs-validation" ngNativeValidate [formGroup]="loginForm"
                (ngSubmit)="onSubmit()">
                <div class="alert alert-danger" *ngIf='invalidLogin'>{{errorMessage}}</div>
                <div class="alert alert-success" *ngIf='loginSuccess'>{{successMessage}}</div>
                <h1>Login</h1>
                <p class="text-medium-emphasis">Sign In to your account</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText style="height: 37px;">
                    <svg cIcon name="cilUser" ></svg>
                  </span>
                  <c-col *ngIf="loginForm.controls['username'] as ctrl">
                    <input [valid]="
                        ctrl.touched && ctrl.valid
                          ? true
                          : (submitted || ctrl.touched) && ctrl.invalid
                          ? false
                          : undefined
                      " autocomplete="off" cFormControl formControlName="username" id="username" placeholder="Username"
                      required />
                    <c-form-feedback *ngIf="submitted || ctrl.invalid" [valid]="!(submitted || ctrl.invalid)">
                      <ng-container *ngIf="ctrl.errors as errors">
                        <div *ngIf="errors['required']">Username is required</div>
                      </ng-container>
                    </c-form-feedback>

                  </c-col>

                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText style="height: 37px;">
                    <div (click)="togglePasswordVisibility()" style="cursor: pointer;">
                      <svg cIcon name="cilLockLocked"></svg>
                    </div>
                    
                  </span> 
                  <c-col *ngIf="loginForm.controls['password'] as ctrl">
                    <input [valid]="
                        ctrl.touched && ctrl.valid
                          ? true
                          : (submitted || ctrl.touched) && ctrl.invalid
                          ? false
                          : undefined
                      " autocomplete="new-password" cFormControl formControlName="password" id="password"
                      placeholder="Password" required [type]="passwordVisible ? 'text' : 'password'" />
                    <c-form-feedback *ngIf="submitted || ctrl.invalid" [valid]="!(submitted || ctrl.invalid)">
                      <ng-container *ngIf="ctrl.errors as errors">
                        <div *ngIf="errors?.['required']">Password is required</div>
                      </ng-container>
                    </c-form-feedback>
                  </c-col>
                </c-input-group>
                
                <c-row>
                  <c-col xs="8"></c-col>
                  <c-col xs="4">
                    <button (click)="onValidate()" cButton type="submit" class="px-4" color="primary">
                      Connecter
                    </button>
                  </c-col>
                </c-row>

              </form>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
</body>
</html>
