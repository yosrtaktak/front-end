<c-navbar colorScheme="light" expand="lg" class="bg-light">
    <c-container fluid>
      <button [cNavbarToggler]="collapseRef"></button>
      <div #collapseRef="cCollapse" navbar cCollapse>
        <c-navbar-nav class="me-auto mb-2 mb-lg-0">
          <c-nav-item>
            <a cNavLink routerLink="./dashboard" >Menu</a>
          </c-nav-item>
        </c-navbar-nav>
        <form cForm class="d-flex" role="search">
          <input cFormControl type="search" (keyup)="applyFilter($event)" placeholder="Search" aria-label="Search" class="me-2">
          <mat-icon  style="margin-top: 7px;padding-right:50px ; ">search</mat-icon>
        </form>
       
      </div>
    </c-container>
  </c-navbar>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
    
      @media screen and (max-width: 767px) {
  .custom-button {
    margin-left: 180px; /* Ajustez la marge gauche selon vos besoins */
  }
  .example-container {
        overflow-x: auto; /* Ajoute une barre de défilement horizontale */
        max-width: 100%; /* Assurez-vous que le tableau ne dépasse pas la largeur de l'écran */
        display: block; /* Permet au conteneur de définir sa propre largeur */
      }
}
    </style>
  </head>
  <body class="example-container">
  <mat-toolbar style="background-color: #1c569f">
  <div class="row">
    <div class="col-3">
      <p class="page-heading" style="color: azure;"> Gestion d'utilisateur </p>
    </div>
    <div class="col-9">
  
      <button cButton color="light" variant="outline" class="custom-button" (click)="onAdd()"><mat-icon style="height: 17px">person_add</mat-icon> Ajouter</button>
    </div>
  </div>
  </mat-toolbar>
  <br>
  
  <br>
  <div class="mat-elevation-z8 example-container"  >
  
    <table mat-table cTable hover [dataSource]="dataSource">
  
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef> Nom utilisateur</th>
        <td mat-cell *matCellDef="let element"> {{element.username}} </td>
      </ng-container>
  
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>
  
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef> Roles </th>
        <td mat-cell *matCellDef="let element">
          <span *ngFor="let role of element.roles">{{ role.name }} </span>
        </td>
      </ng-container>
  
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element" class="actions-cell">
          <div class="action-buttons">
            <button [cPopoverTrigger]="'hover'" cButton color="warning" variant="ghost" cPopover="modifier utilisateur" cPopoverPlacement="bottom" size="sm" (click)="onEdit(element)">
              <mat-icon>edit</mat-icon>
            </button> 
            <button [cPopoverTrigger]="'hover'" cButton cPopover="supprimer utilisateur" cPopoverPlacement="bottom" color="danger" variant="ghost" size="sm" (click)="onDelete(element)">
              <mat-icon>cancel</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [pageSizeOptions]="[5 , 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
</body>
</html>
